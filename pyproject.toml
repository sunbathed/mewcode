[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mewcode"
version = "0.1.0"
description = "A terminal LLM conversation assistant"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "textual>=0.50.0",
    "PyYAML>=6.0",
]

[project.scripts]
mewcode = "mewcode.__main__:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    # Windows ProactorEventLoop 下子进程 pipe transport 在 loop 关闭后 GC 的
    # 已知平台噪音（CPython asyncio，与应用代码无关）。
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.setuptools.packages.find]
where = ["src"]
