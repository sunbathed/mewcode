<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrB" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#0E7490"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#059669"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1024" height="1536" fill="#F7FAF9"/>

  <!-- 顶部标题栏 -->
  <rect x="0" y="0" width="1024" height="150" fill="#14532D"/>
  <circle cx="84" cy="75" r="34" fill="#047857"/>
  <path d="M70,72 L82,84 L102,60" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="140" y="64" font-size="42" fill="#FFFFFF" font-weight="bold">LLM Wiki 的改进</text>
  <text x="140" y="112" font-size="24" fill="#BBF7D0">把「查询时检索」升级为「摄入时结构化」：编译互链的知识维基</text>

  <!-- ============ 摄入阶段 ============ -->
  <text x="60" y="196" font-size="22" fill="#047857" font-weight="bold">阶段一 · 摄入：LLM 离线编译知识库</text>

  <!-- 节点1 原始语料 -->
  <rect x="40" y="220" width="180" height="170" rx="16" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="2.5"/>
  <rect x="70" y="250" width="120" height="15" rx="4" fill="#ECFDF5"/>
  <rect x="60" y="272" width="130" height="15" rx="4" fill="#ECFDF5"/>
  <rect x="65" y="294" width="125" height="15" rx="4" fill="#ECFDF5"/>
  <rect x="72" y="316" width="118" height="15" rx="4" fill="#ECFDF5"/>
  <text x="130" y="360" font-size="20" fill="#334155" text-anchor="middle" font-weight="bold">原始语料</text>
  <text x="130" y="382" font-size="15" fill="#64748B" text-anchor="middle">课程文档 / 手册 / 网页</text>

  <!-- 箭头 -->
  <line x1="220" y1="305" x2="278" y2="305" stroke="#0E7490" stroke-width="3" marker-end="url(#arrB)"/>

  <!-- 节点2 LLM 编译 -->
  <rect x="288" y="220" width="200" height="170" rx="16" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="2.5"/>
  <rect x="330" y="244" width="116" height="70" rx="12" fill="#ECFDF5"/>
  <rect x="322" y="238" width="132" height="10" rx="3" fill="#D1FAE5"/>
  <rect x="322" y="252" width="132" height="10" rx="3" fill="#D1FAE5"/>
  <rect x="322" y="266" width="132" height="10" rx="3" fill="#D1FAE5"/>
  <rect x="330" y="288" width="116" height="10" rx="3" fill="#D1FAE5"/>
  <text x="388" y="336" font-size="19" fill="#065F46" text-anchor="middle" font-weight="bold">LLM 离线编译</text>
  <text x="388" y="360" font-size="15" fill="#047857" text-anchor="middle">精读·去噪·归纳·建链</text>
  <text x="388" y="378" font-size="15" fill="#047857" text-anchor="middle">一次性成本，查询零开销</text>

  <!-- 箭头 -->
  <line x1="488" y1="305" x2="546" y2="305" stroke="#0E7490" stroke-width="3" marker-end="url(#arrB)"/>

  <!-- 节点3 互链概念页 -->
  <rect x="556" y="220" width="428" height="170" rx="16" fill="#FFFFFF" stroke="#34D399" stroke-width="3"/>
  <text x="770" y="252" font-size="19" fill="#065F46" text-anchor="middle" font-weight="bold">互相链接的概念页（Wiki 风格）</text>
  <!-- 三个概念页 -->
  <rect x="584" y="272" width="104" height="54" rx="10" fill="#D1FAE5"/>
  <text x="636" y="300" font-size="16" fill="#047857" text-anchor="middle" font-weight="bold">概念A</text>
  <text x="636" y="318" font-size="13" fill="#065F46" text-anchor="middle">交叉引用</text>
  <rect x="718" y="272" width="104" height="54" rx="10" fill="#A7F3D0"/>
  <text x="770" y="300" font-size="16" fill="#047857" text-anchor="middle" font-weight="bold">概念B</text>
  <text x="770" y="318" font-size="13" fill="#065F46" text-anchor="middle">交叉引用</text>
  <rect x="852" y="272" width="104" height="54" rx="10" fill="#D1FAE5"/>
  <text x="904" y="300" font-size="16" fill="#047857" text-anchor="middle" font-weight="bold">概念C</text>
  <text x="904" y="318" font-size="13" fill="#065F46" text-anchor="middle">交叉引用</text>
  <line x1="690" y1="300" x2="716" y2="300" stroke="#059669" stroke-width="2.5" marker-end="url(#arrG)"/>
  <line x1="824" y1="300" x2="850" y2="300" stroke="#059669" stroke-width="2.5" marker-end="url(#arrG)"/>
  <!-- 回链出处 -->
  <text x="770" y="354" font-size="14" fill="#065F46" text-anchor="middle">每页带「原文出处」回链 ↪ 第X章 / 第X讲</text>
  <text x="770" y="376" font-size="14" fill="#065F46" text-anchor="middle">论断可一键追溯到原始来源</text>

  <!-- ============ 查询阶段 ============ -->
  <text x="60" y="448" font-size="22" fill="#047857" font-weight="bold">阶段二 · 查询：顺着链接导航，而非碎片拼接</text>

  <!-- 提问 -->
  <rect x="40" y="472" width="200" height="150" rx="16" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="2.5"/>
  <text x="140" y="512" font-size="19" fill="#065F46" text-anchor="middle" font-weight="bold">用户提问</text>
  <ellipse cx="140" cy="552" rx="66" ry="26" fill="#ECFDF5"/>
  <text x="140" y="548" font-size="16" fill="#047857" text-anchor="middle">为什么 A 影响 B？</text>
  <text x="140" y="596" font-size="15" fill="#64748B" text-anchor="middle">跨章节综合问题</text>

  <!-- 箭头 -->
  <line x1="240" y1="547" x2="298" y2="547" stroke="#0E7490" stroke-width="3" marker-end="url(#arrB)"/>

  <!-- 定位概念页 -->
  <rect x="308" y="472" width="240" height="150" rx="16" fill="#FFFFFF" stroke="#34D399" stroke-width="2.5"/>
  <rect x="344" y="500" width="70" height="42" rx="8" fill="#A7F3D0"/>
  <text x="379" y="526" font-size="15" fill="#047857" text-anchor="middle" font-weight="bold">概念A</text>
  <rect x="430" y="500" width="70" height="42" rx="8" fill="#A7F3D0"/>
  <text x="465" y="526" font-size="15" fill="#047857" text-anchor="middle" font-weight="bold">概念B</text>
  <line x1="416" y1="521" x2="428" y2="521" stroke="#059669" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="428" y="568" font-size="16" fill="#065F46" text-anchor="middle" font-weight="bold">精确定位相关页</text>
  <text x="428" y="596" font-size="14" fill="#047857" text-anchor="middle">顺着交叉引用跳转导航</text>

  <!-- 箭头 -->
  <line x1="548" y1="547" x2="606" y2="547" stroke="#0E7490" stroke-width="3" marker-end="url(#arrB)"/>

  <!-- LLM 生成 -->
  <rect x="616" y="472" width="368" height="150" rx="16" fill="#FFFFFF" stroke="#34D399" stroke-width="2.5"/>
  <rect x="640" y="492" width="320" height="110" rx="10" fill="#ECFDF5"/>
  <text x="800" y="532" font-size="20" fill="#065F46" text-anchor="middle" font-weight="bold">大语言模型生成回答</text>
  <text x="800" y="560" font-size="15" fill="#047857" text-anchor="middle">以完整概念页为上下文，结构完整</text>
  <text x="800" y="584" font-size="15" fill="#047857" text-anchor="middle">每一论断都带「可点击引用」</text>

  <!-- ============ 底部：对比数据 ============ -->
  <rect x="60" y="664" width="904" height="760" rx="20" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="2"/>
  <text x="512" y="722" font-size="30" fill="#065F46" text-anchor="middle" font-weight="bold">对照实验结果（同一课堂语料，LLM 裁判按人工标准评分）</text>

  <!-- 行1 单事实 -->
  <text x="110" y="800" font-size="22" fill="#334155" font-weight="bold">单事实问答</text>
  <rect x="110" y="816" width="840" height="52" rx="10" fill="#F1F5F9"/>
  <rect x="110" y="816" width="644" height="52" rx="10" fill="#94A3B8"/>
  <text x="620" y="850" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">向量 RAG：9.33 / 10</text>
  <rect x="110" y="884" width="840" height="52" rx="10" fill="#F1F5F9"/>
  <rect x="110" y="884" width="686" height="52" rx="10" fill="#10B981"/>
  <text x="640" y="918" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">LLM Wiki：9.96 / 10</text>

  <!-- 行2 跨单元 -->
  <text x="110" y="1020" font-size="22" fill="#334155" font-weight="bold">跨单元综合推理</text>
  <rect x="110" y="1036" width="840" height="52" rx="10" fill="#F1F5F9"/>
  <rect x="110" y="1036" width="562" height="52" rx="10" fill="#DC2626"/>
  <text x="550" y="1070" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">向量 RAG：8.14 / 10</text>
  <rect x="110" y="1104" width="840" height="52" rx="10" fill="#F1F5F9"/>
  <rect x="110" y="1104" width="685" height="52" rx="10" fill="#10B981"/>
  <text x="640" y="1138" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">LLM Wiki：9.93 / 10</text>

  <!-- 行3 可溯源 -->
  <text x="110" y="1240" font-size="22" fill="#334155" font-weight="bold">回答来源可追溯性</text>
  <rect x="110" y="1256" width="840" height="52" rx="10" fill="#F1F5F9"/>
  <rect x="110" y="1256" width="430" height="52" rx="10" fill="#DC2626"/>
  <text x="425" y="1290" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">向量 RAG：64%</text>
  <rect x="110" y="1324" width="840" height="52" rx="10" fill="#F1F5F9"/>
  <rect x="110" y="1324" width="672" height="52" rx="10" fill="#10B981"/>
  <text x="620" y="1358" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="bold">LLM Wiki：100% 可溯源</text>

  <!-- 底部注 -->
  <text x="512" y="1460" font-size="18" fill="#64748B" text-anchor="middle">结论：简单事实两者旗鼓相当；一旦需要跨章节联系，Wiki 结构全面领先。</text>
</svg>
